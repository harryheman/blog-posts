apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: http01-clusterissuer
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # Заменить на свой
    email: myname@mail.com
    privateKeySecretRef:
      name: http01-clusterissuer-key
    solvers:
      - http01:
          ingress:
            class: nginx
